<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lists</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="tabs">
      <button class="tab active" data-list="todo">Todo</button>
      <button class="tab" data-list="shopping">Shopping</button>
    </div>

    <form id="add-form">
      <input type="text" id="item-text" placeholder="Add item..." autocomplete="off" required>
      <button type="submit">Add</button>
    </form>

    <ul id="item-list"></ul>
  </div>

  <script src="app.js"></script>
</body>
</html>
