name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Build binary (linux/amd64)
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: go build -o dist/todo-server ./cmd/server

      - name: Package release archive
        run: |
          mkdir -p dist/package
          cp dist/todo-server dist/package/
          cp -r web dist/package/web
          tar -czf dist/todo-linux-amd64.tar.gz -C dist/package .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: todo-linux-amd64
          path: dist/todo-linux-amd64.tar.gz

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/todo-linux-amd64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
